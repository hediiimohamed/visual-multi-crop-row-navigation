/**:
  ros__parameters:
    # ==================== TOPICS ====================
    # Eterry gen5 sim: visual_nav_camera (gen5_gz.urdf + gz_bridge.yaml), RGB only
    frontColor_topic: "visual_nav_camera/rgb/image_raw"
    frontDepth_topic: "visual_nav_camera/depth/image_raw"
    frontCameraInfo_topic: "visual_nav_camera/rgb/camera_info"
    # No back camera on Eterry: the "exit lane" stage (mode 2) reuses the front camera
    backColor_topic: "visual_nav_camera/rgb/image_raw"
    backDepth_topic: "visual_nav_camera/depth/image_raw"
    backCameraInfo_topic: "visual_nav_camera/rgb/camera_info"
    cmd_vel_topic: "/cmd_vel"

    # ==================== ROBOT (Eterry gen5) ====================
    # visual_nav_camera_joint in gen5_gz.urdf: on the ZED 2i mount in the middle of the robot,
    # base_link + (0.13, 0.135, 0.168), pitched 0.60 rad down;
    # base_link rests ~1.09 m above ground (measured in sim)
    camera_height: 1.258
    camera_tilt: -0.60
    camera_forward_offset: 0.13    # ahead of base_link x=0 (zero lateral velocity line)
    camera_lateral_offset: 0.135   # left of base_link (negative: right), ~0.2 m left of the bed centre
    # plant centers are detected on the canopy, not on the ground (sim beans: 0.2 m +/-40 %)
    crop_plane_height: 0.12
    camera_yaw: 0.0                # rad (> 0: camera turned left)
    camera_roll: 0.0               # rad, mounting error (> 0: right side down)
    # carrier_controller: vx/wz only, |wz| <= |vx| / 1.2567 m (min turning radius)
    linearVel: 0.2
    exitLinearVel: 0.05
    maxOmega: 0.15                 # ~ kinematic limit at 0.2 m/s
    omegaScaler: 0.03              # visual_servo only, needs a camera above the lane centre
    # steering: pure_pursuit on the lane center line (metres), or visual_servo (previous)
    controller: "pure_pursuit"
    lookahead_distance: 2.5        # m; shorter: tighter but oscillates with the steering lag
    lane_offset: 0.06              # m, base_link left of the lane center (sim: swath 6 cm left of the bed)
    # Eterry cannot drive sideways (linear.y is ignored): stop at the row end
    enable_row_switching: false

    # ==================== IMAGE PROCESSING (960x540) ====================
    processing_width: 0            # downscale wider images first (e.g. 960 for a 1920 ZED); 0: off
    # all pixel values below refer to the processed image
    point_extraction: "bands"      # one point per vegetation run in each band (continuous rows ok)
    band_height: 12                # px
    exg_normalized: true           # brightness independent green index (shadows, sun)
    exg_min: 0.1                   # minimal green level 0..1: bare soil gives no plant
    exg_blur: 5                    # px, blur before the threshold; 0 for seedlings of 1-3 px
    min_run_width: 3               # px, narrowest vegetation run giving a point (seedlings: 1)
    band_fill: 0.3                 # share of the band height a column must be green (seedlings: 0.1)
    # Plants between scanStartPoint and scanEndPoint (image columns) are used to find the rows by the
    # image scanner only. ground_tracking: the rows are found in the tracked band (bottomOffset ..
    # imgHeight - topOffset), across the whole width; the bed is told from its neighbours by the wheel paths
    minContourArea: 40
    scanSteps: 30
    scanStartPoint: 330            # bed rows at u~410..710 near, neighbour beds at u~270 and ~860
    scanEndPoint: 790
    scanWindowWidth: 60
    trackingBoxWidth: 100
    topOffset: 40
    bottomOffset: 40
    sacleRatio: 0.8
    enable_roi: false

    p1: [0, 0]
    p2: [0, 0]
    p3: [0, 0]
    p4: [0, 0]
    p5: [0, 0]
    p6: [0, 0]
    p7: [0, 0]
    p8: [0, 0]

    # ==================== GROUND ROW TRACKING ====================
    # Plant centers projected on the ground (odom frame), each row fitted on its last
    # plants, every estimate checked in metres
    odom_frame: "odom"
    base_frame: "base_link"
    min_rows: 2                    # rows needed to compute the lane center
    furrow_width: 0.0              # m between two rows; 0: measured from the rows found at start
    furrow_tolerance: 0.25         # robot within half a furrow + 25 % of the lane center at init
    max_furrow_width: 1.2          # m, longest row spacing searched when measuring it
    # rows of one bed (sim: 3). 0: counted at the start of each row (the rows of the bed, 0.7 to 1.45
    # furrow apart, up to the wheel paths). Set it for seedlings with dense weeds (a weed strip can
    # count as a row) and for beds whose wheel path is under 1.45 furrow (rows 0.45 m apart on 1.5 m beds)
    lane_rows: 3
    init_confirm_frames: 3         # the same lane must be found in 3 images before driving
    history_size: 400              # last plant centers kept per row (enough to reach under the robot)
    history_length: 1.0            # m of history kept behind the camera view (longer: lags in wavy rows)
    max_lateral_jump: 0.05         # m, larger change between two images is rejected
    max_lateral_error: 0.0         # m, 0: furrow_width / 2
    max_heading_error: 15.0        # deg
    max_bad_frames: 5              # rejected images in a row -> rows lost
    max_row_gap: 1.0               # m driven without seeing a row -> that row is not used
    # wavy rows: each row is a curve y = a + b*x + c*x^2 over its history (bend fitted on >= 2.5 m)
    max_curvature: 0.2             # 1/m, sharpest bend fitted (radius 5 m); 0: straight lines
    # the rows of a bed keep their spacing: a row further than row_consistency * furrow from its
    # place in the lane slid onto a neighbour row or weeds: not used, its wrong plants forgotten
    row_consistency: 0.35          # (a row on its neighbour or between two: >= 0.5)
    # a lane row whose plants are much narrower than those of the other rows over the last
    # metre is weeds (e.g. in a wheel path two furrows wide): the lane slid, rows lost
    crop_width_ratio: 0.4          # 0.0: off (needs point_extraction: bands); not used while the rows are < 3 cm wide (seedlings)
    # end of row: no row plant ahead in row_end_frames images -> EXIT: drive on along the lane
    # (odometry) until base_link is row_end_offset past the last plant, then vs_nav/row_end
    row_end_frames: 5
    row_end_distance: 0.5          # m driven without plants ahead, as well
    row_end_offset: 0.0            # m (e.g. tool behind base_link: its distance, negative ahead)

    # ==================== RECOVERY (rows lost) ====================
    # stop, scan recovery_scan_time; if no rows, drive recovery_step forward and scan again;
    # nothing after recovery_max_distance -> FAILED (stopped until vs_nav/start)
    recovery_scan_time: 1.0        # s
    recovery_step: 0.10            # m
    recovery_max_distance: 1.0     # m

    # ==================== WATCHDOGS ====================
    image_timeout: 0.5             # s without a new camera image -> stop
    max_omega_rate: 0.5            # rad/s^2, limit on the steering command change
    # independent of the camera: the camera alone cannot tell a wrong bed from the right one
    # when both look the same (weeds in a wheel path two furrows wide). The planned coverage
    # path (nav_msgs/Path, e.g. /coverage_server/coverage_plan, or a GNSS track) must stay
    # within max_path_deviation of base_link, or FAILED. Set it above how far the real rows
    # wander from the plan (RTK seeding: 0.3; Isaac beds2/3/weeds2 manual seeding: 0.6-0.7)
    reference_path_topic: ""       # "": off
    max_path_deviation: 0.5        # m
    path_deviation_frames: 5       # images in a row beyond it

    # Debug
    verbose: false                 # per-image debug output (costs CPU)
    stationaryDebug: false
