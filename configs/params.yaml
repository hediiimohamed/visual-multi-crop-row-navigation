/**:
  ros__parameters:
    # ==================== TOPICS ====================
    frontColor_topic: "front/rgb/image_raw"
    frontDepth_topic: "front/depth/image_raw"
    frontCameraInfo_topic: "front/rgb/camera_info" 
    backColor_topic: "back/rgb/image_raw"
    backDepth_topic: "back/depth/image_raw"
    backCameraInfo_topic: "back/camera_info"
    cmd_vel_topic: "/cmd_vel"
    
    # ==================== PARAMÈTRES IMPORTANTS ====================
    minContourArea: 150        # Augmenté pour filtrer plus de bruit
    scanSteps: 45
    scanStartPoint: 400        # Démarrer plus à droite
    scanEndPoint: 1520         # Finir avant le bord
    scanWindowWidth: 200       # Fenêtres plus larges
    trackingBoxWidth: 280
    topOffset: 180
    bottomOffset: 180
    sacleRatio: 0.8
    enable_roi: false
    
    # # ROI pour 1920x1080
    p1: [0, 0]
    p2: [0, 0]
    p3: [0, 0]
    p4: [0, 0]
    p5: [0, 0]
    p6: [0, 0]
    p7: [0, 0]
    p8: [0, 0]
    
    # Debug
    stationaryDebug: false